name: Auto Bump Build Number

on:
  push:
    branches: [ main ]
    paths: [ 'index.html' ]

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment APP_BUILD in index.html
        run: |
          CURRENT=$(grep -oP 'var APP_BUILD\s+=\s+\K[0-9]+' index.html | head -1)
          if [ -z "$CURRENT" ]; then
            echo "Could not find APP_BUILD — skipping"
            exit 0
          fi
          NEW=$((CURRENT + 1))
          MAJOR=$(grep -oP 'var APP_VERSION\s+=\s+\K[0-9]+' index.html | head -1)
          echo "Bumping build $MAJOR.$CURRENT → $MAJOR.$NEW"
          sed -i "s/var APP_BUILD   = $CURRENT;/var APP_BUILD   = $NEW;/" index.html

      - name: Commit new build number
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          MAJOR=$(grep -oP 'var APP_VERSION\s+=\s+\K[0-9]+' index.html | head -1)
          BUILD=$(grep -oP 'var APP_BUILD\s+=\s+\K[0-9]+' index.html | head -1)
          git commit -m "[version-bump] v$MAJOR.$BUILD" || echo "Nothing to commit"
          git push
